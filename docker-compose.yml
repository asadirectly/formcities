# optional, only needed if you want to run everything in containers instead of
# just running npm start in three terminals like the readme says
version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server/data:/app/data
      - ./sites-storage:/sites-storage
    environment:
      - PORT=3000

  static-server:
    build: ./static-server
    ports:
      - "8080:8080"
    volumes:
      - ./sites-storage:/sites-storage
    environment:
      - STATIC_PORT=8080

  frontend:
    build: ./frontend
    ports:
      - "5174:5174"
