# this config is for when you're switching from local dev to real hosting.
# this isolate each student site on its own subdomain, which is the "real" way to do the origin isolation, path based /sites/:slug/ is fine for local testing
# but subdomains are stronger security.

server {
    listen 80;
    server_name ~^(?<slug>.+)\.sites\.yourschool\.edu$;

    root /var/www/sites-storage/$slug;
    index index.html;

    # same headers as the node static server, keep these in sync if you change one
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'self'";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        try_files $uri $uri/ =404;
    }
}
